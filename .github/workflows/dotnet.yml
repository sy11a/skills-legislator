# BL-082 (R-8203, C-12): the release matrix.
#
# NativeAOT does not cross-compile between operating systems, so a released RID has no builder
# anywhere else: `tools/publish-legislator.sh` publishes the host's RID and refuses the rest by
# name. This workflow is therefore part of the edition rather than incidental configuration, and
# `evals/check_static.py` holds it to building every RID the edition releases — a set it READS
# from that script's `released=(...)` line — under the same strict discipline as the local gate
# (operator ruling 2026-09-04).
#
# BL-408: one RID. The operator ruled on 2026-09-23 that the edition releases linux-x64 alone —
# development is Linux-only, win-x64 had been red since BL-372 (four projects, 111 failures), and
# a matrix carrying three RIDs nobody runs made every tagged release a red workflow run and the
# red permanent. Restoring a RID is adding its row back here and to `released=(...)`, in one act
# (ADR 0013).
name: dotnet

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pushed commit supersedes the run of the one before it on the same ref.
concurrency:
  group: dotnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  rid: linux-x64 }
          # Retired by ADR 0013, kept here as the record of what they were rather than as
          # archaeology for whoever restores them:
          #   win-x64    windows-latest  — red since BL-372
          #   osx-x64    macos-15-intel  — macos-13 was the last Intel image under a bare
          #                                version label and GitHub retired it; a job naming it
          #                                is never picked up (BL-370)
          #   osx-arm64  macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build strict
        run: dotnet build src -warnaserror --nologo

      # The startup budget is a property of the reference machine, not of a shared runner
      # whose wall time says nothing about a developer's laptop - so it is skipped here and
      # measured locally. The variable stays outside the LEGISLATOR_* namespace, which the
      # binary reads as option keys and refuses by name (R-8210).
      - name: Test
        env:
          STARTUP_BUDGET_SKIP: '1'
        run: bash evals/check_dotnet.sh

      - name: Publish ${{ matrix.rid }}
        shell: bash
        run: tools/publish-legislator.sh ${{ matrix.rid }}

      - uses: actions/upload-artifact@v5
        with:
          name: legislator-${{ matrix.rid }}
        # win-x64 publishes `legislator.exe`, so its path stays listed: restoring
        # that RID must really be the two edits ADR 0013 promises and not a third
        # nobody documents — the round found the two-edit tree red at upload.
        # `upload-artifact` errors only when NO path matches, so a line that
        # matches nothing on this RID costs nothing.
          path: |
            artifacts/${{ matrix.rid }}/legislator
            artifacts/${{ matrix.rid }}/legislator.exe
            artifacts/SHA256SUMS
          if-no-files-found: error
