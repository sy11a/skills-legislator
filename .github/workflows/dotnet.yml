# BL-082 (R-8203, C-12): the release matrix.
#
# NativeAOT does not cross-compile between operating systems, so three of the edition's four
# RIDs have no builder anywhere else: `tools/publish-legislator.sh` publishes the host's RID
# and refuses the rest by name. This workflow is therefore part of the edition rather than
# incidental configuration, and `evals/check_static.py` holds it to naming every released RID
# and building under the same strict discipline as the local gate (operator ruling 2026-09-04).
name: dotnet

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pushed commit supersedes the run of the one before it on the same ref.
concurrency:
  group: dotnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  rid: linux-x64 }
          - { os: windows-latest, rid: win-x64 }
          # macos-13 was the last Intel image under a bare version label and GitHub retired it;
          # a job naming it is never picked up, sits queued for a day and leaves the whole run
          # without a conclusion (BL-370). The Intel image is now named as one.
          - { os: macos-15-intel, rid: osx-x64 }
          - { os: macos-latest,   rid: osx-arm64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build strict
        run: dotnet build src -warnaserror --nologo

      # The startup budget is a property of the reference machine, not of a shared runner
      # whose wall time says nothing about a developer's laptop - so it is skipped here and
      # measured locally. The variable stays outside the LEGISLATOR_* namespace, which the
      # binary reads as option keys and refuses by name (R-8210).
      - name: Test
        # PROBE (BL-370) - reverted before review: lets the Windows job past its red suite once,
        # to see whether Publish and the upload work there at all.
        continue-on-error: ${{ matrix.rid == 'win-x64' }}
        env:
          STARTUP_BUDGET_SKIP: '1'
        run: bash evals/check_dotnet.sh

      - name: Publish ${{ matrix.rid }}
        shell: bash
        run: tools/publish-legislator.sh ${{ matrix.rid }}

      - uses: actions/upload-artifact@v5
        with:
          name: legislator-${{ matrix.rid }}
          path: |
            artifacts/${{ matrix.rid }}/legislator
            artifacts/${{ matrix.rid }}/legislator.exe
            artifacts/SHA256SUMS
          if-no-files-found: error
